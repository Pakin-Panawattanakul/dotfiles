# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# menu and terminal
binds=SUPER,d,spawn,rofi -show drun -show-icons
binds=SUPER,t,spawn,foot
binds=SUPER,b,spawn,firefox
binds=SUPER,f,spawn,thunar
#binds=SUPER,b,spawn,brave-origin

binds=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 10%+
binds=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 10%-
binds=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
binds=NONE,XF86AudioNext,spawn,mpc next
binds=NONE,XF86AudioPrev,spawn,mpc prev
binds=NONE,XF86AudioPlay,spawn,mpc toggle
binds=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 10%+
binds=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 10%-
binds=NONE,print,spawn,screenshot.sh

#binds=SUPER+SHIFT,r,spawn,sh -c "mmsg dispatch view,7; ! pgrep -x rmpc && foot -a rmpc -T rmpc rmpc"
binds=SUPER+SHIFT,s,spawn,sh -c "mmsg dispatch view,7; ! pgrep -x ncspot && foot -a ncspot -T ncspot ncspot"
binds=SUPER+SHIFT,r,view,7,0
binds=SUPER+SHIFT,v,spawn,vesktop
binds=SUPER+SHIFT,t,spawn,thunderbird
binds=SUPER+SHIFT,p,spawn,foot -a wiremix -T wiremix wiremix
binds=SUPER+SHIFT,b,spawn,foot -a bluetui -T bluetui bluetui
binds=SUPER+SHIFT,w,spawn,foot -a impala -T impala impala

# reload config
binds=SUPER+SHIFT,c,reload_config

# exit
#binds=SUPER+SHIFT,q,quit
binds=SUPER+SHIFT,q,spawn,rofi-powermenu
binds=SUPER,q,killclient,

# switch window focus
binds=SUPER,Tab,focusstack,next
binds=SUPER,Left,focusdir,left
binds=SUPER,Right,focusdir,right
binds=SUPER,Up,focusdir,up
binds=SUPER,Down,focusdir,down
binds=SUPER,m,focusdir,left
binds=SUPER,i,focusdir,right
binds=SUPER,e,focusdir,up
binds=SUPER,n,focusdir,down
#binds=SUPER,h,focusdir,left
#binds=SUPER,l,focusdir,right
#binds=SUPER,k,focusdir,up
#binds=SUPER,j,focusdir,down
binds=SUPER,l,focusstack,prev
binds=SUPER,u,focusstack,next

# swap window
binds=SUPER+SHIFT,Up,exchange_client,up
binds=SUPER+SHIFT,Down,exchange_client,down
binds=SUPER+SHIFT,Left,exchange_client,left
binds=SUPER+SHIFT,Right,exchange_client,right
binds=SUPER+SHIFT,e,exchange_client,up
binds=SUPER+SHIFT,n,exchange_client,down
binds=SUPER+SHIFT,m,exchange_client,left
binds=SUPER+SHIFT,i,exchange_client,right
#binds=SUPER+SHIFT,k,exchange_client,up
#binds=SUPER+SHIFT,j,exchange_client,down
#binds=SUPER+SHIFT,h,exchange_client,left
#binds=SUPER+SHIFT,l,exchange_client,right
binds=SUPER+SHIFT,l,exchange_stack_client,prev
binds=SUPER+SHIFT,u,exchange_stack_client,next

# switch window status
binds=SUPER+SHIFT,g,toggleglobal,
binds=SUPER,g,togglefloating,
binds=ALT,Tab,toggleoverview,
binds=SUPER+SHIFT,f,togglemaximizescreen,
binds=NONE,f11,togglefullscreen,
binds=SUPER,o,toggleoverlay,

# -------------------- layout --------------------
# switch layout
binds=SUPER,y,switch_layout
binds=SUPER,o,toggleoverview
