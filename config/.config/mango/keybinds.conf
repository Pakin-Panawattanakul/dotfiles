binds=SUPER+CTRL,i,viewtoright,0
binds=SUPER+CTRL,h,viewtoleft,0
binds=SUPER+CTRL,l,viewtoright,0
binds=SUPER+CTRL+SHIFT,Left,tagtoleft,0
binds=SUPER+CTRL+SHIFT,Right,tagtoright,0
binds=SUPER+CTRL+SHIFT,m,tagtoleft,0
binds=SUPER+CTRL+SHIFT,i,tagtoright,0
binds=SUPER+CTRL+SHIFT,h,tagtoleft,0
binds=SUPER+CTRL+SHIFT,l,tagtoright,0
