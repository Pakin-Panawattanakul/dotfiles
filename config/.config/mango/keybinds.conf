# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 10%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 10%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioNext,spawn,mpc next
bind=NONE,XF86AudioPrev,spawn,mpc prev
bind=NONE,XF86AudioPlay,spawn,mpc toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 10%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 10%-
bind=NONE,print,spawn,screenshot.sh

bind=SUPER+SHIFT,r,spawn,sh -c "! pgrep -x rmpc && foot -a rmpc -t rmpc rmpc"
bind=SUPER+SHIFT,r,view,7,0
bind=SUPER+SHIFT,v,spawn,vesktop
bind=SUPER+SHIFT,t,spawn,thunderbird

# reload config
bind=SUPER+SHIFT,c,reload_config

# menu and terminal
bind=SUPER,d,spawn,rofi -show drun -show-icons
bind=SUPER,t,spawn,foot
bind=SUPER,b,spawn,firefox

# exit
#bind=SUPER+SHIFT,q,quit
bind=SUPER+SHIFT,q,spawn,rofi-powermenu
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,m,focusdir,left
bind=SUPER,i,focusdir,right
bind=SUPER,e,focusdir,up
bind=SUPER,n,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,e,exchange_client,up
bind=SUPER+SHIFT,n,exchange_client,down
bind=SUPER+SHIFT,m,exchange_client,left
bind=SUPER+SHIFT,i,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER+SHIFT,g,toggleglobal,
bind=SUPER,g,togglefloating,
bind=ALT,Tab,toggleoverview,
bind=SUPER+SHIFT,f,togglemaximizescreen,
bind=NONE,f11,togglefullscreen,
bind=SUPER,o,toggleoverlay,
#bind=SUPER,h,minimized,
#bind=SUPER+SHIFT,h,restore_minimized
#bind=ALT,z,toggle_scratchpad
#bind=ALT+SHIFT,f,togglefakefullscreen,

# -------------------- layout --------------------
# switch layout
bind=SUPER,y,switch_layout
bind=SUPER,o,toggleoverview
# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

